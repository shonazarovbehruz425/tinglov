name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20 (cache npm)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Typecheck server
        run: npx tsc --noEmit --project tsconfig.server.json

      - name: Build
        run: npm run build

      - name: Audit (high+ vulnerabilities fail CI)
        run: npm audit --audit-level=high

      # Testlar hozircha ixtiyoriy — keyinchalik majburiy bo'ladi
      # (continue-on-error olib tashlanadi)
      - name: Tests
        run: npm test
        continue-on-error: true

      - name: Docker build smoke test
        run: docker build -t tinglov:ci .
