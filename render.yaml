services:
  - type: web
    name: tinglov
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_PATH
        # Render persistent disk uchun izoh: free tier'da disk yo'q,
        # paid tier'da /data ga disk mount qilinadi. Masalan:
        # disk:
        #   name: tinglov-data
        #   mountPath: /data
        #   sizeGB: 1
        value: /data/tinglov.db
      - key: ALLOWED_ORIGINS
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CAPTCHA_SECRET
        generateValue: true
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ADMIN_PATH
        sync: false
      - key: VITE_ADMIN_PATH
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDFLARE_R2_URL
        sync: false
      - key: VITE_CLOUDFLARE_R2_URL
        sync: false
      - key: RENDER_EXTERNAL_URL
        sync: false
# Izoh: DATABASE_PATH persistent disk uchun:
# Agar Render paid plan ishlatilsa, quyidagi disk sozlamasini qo'shing:
# disks:
#   - name: tinglov-data
#     mountPath: /data
#     sizeGB: 1
# Free tier'da SQLite ephemeral bo'ladi — production uchun
# DATABASE_PATH ni /tmp yoki external Postgres/Supabase ga almashtirish tavsiya etiladi.
